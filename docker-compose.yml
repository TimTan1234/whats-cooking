services:
  app:
    build: .
    image: whats-cooking:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8020}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - whatscooking-data:/data

volumes:
  whatscooking-data:
