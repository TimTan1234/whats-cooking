{% extends "base.html" %}
{% from "_ui.html" import icon with context %}
{% block title %}{{ item.name }}{% endblock %}
{% block content %}
<a class="back" href="/#pantry">{{ icon('back') }}{{ t('action.back_kitchen') }}</a>
<h1>{{ t('pantry.edit_title') }}</h1>
<form class="stack" method="post" action="/pantry/{{ item.id }}">
  <label class="field"><span>{{ t('field.ingredient') }}</span><input name="name" value="{{ item.name }}" maxlength="60" required autocomplete="off"></label>
  <label class="field"><span>{{ t('field.quantity') }}</span><input name="quantity" value="{{ item.quantity }}" maxlength="40" autocomplete="off"></label>
  <label class="field"><span>{{ t('field.category') }}</span>
    <select name="category">
      {% for category in categories %}<option value="{{ category }}"{% if category == item.category %} selected{% endif %}>{{ t('cat.' ~ category) }}</option>{% endfor %}
    </select></label>
  <button class="btn btn-primary">{{ t('action.save') }}</button>
</form>
<form class="stack" method="post" action="/pantry/{{ item.id }}/delete">
  <button class="btn btn-danger">{{ t('action.remove') }}</button>
</form>
{% endblock %}
